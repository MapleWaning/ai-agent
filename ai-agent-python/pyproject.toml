[project]
name = "ai-agent"
version = "0.1.0"
description = ""
authors = [
    {name = "maple"}
]
requires-python = "^3.10"
dependencies = [
    "fastapi (>=0.136.3,<0.137.0)",
    "uvicorn (>=0.48.0,<0.49.0)",
    "langchain (>=1.3.2,<2.0.0)",
    "langchain-openai (>=1.2.2,<2.0.0)",
    "pydantic (>=2.13.4,<3.0.0)",
    "dashscope (>=1.20.0,<2.0.0)",
    "langchain-community (>=0.3.0,<1.0.0)",
    "langchain-text-splitters (>=0.3.0,<1.0.0)",
    "beautifulsoup4 (>=4.12.0,<5.0.0)",
    "lxml (>=5.0.0,<6.0.0)",
    "fpdf2 (>=2.8.0,<3.0.0)",
    "langchain-mcp-adapters (>=0.1.0,<1.0.0)",
    "python-dotenv (>=1.0.0,<2.0.0)",
    "pydantic-settings (>=2.0.0,<3.0.0)",
    "redis (>=5.0.0,<6.0.0)",
    "psycopg[binary] (>=3.3.4,<4.0.0)",
    "pgvector (>=0.2.5,<0.4)",
    "langchain-postgres (>=0.0.17,<0.0.18)",
]


[tool.poetry]
package-mode = false

[tool.poetry.group.dev.dependencies]
pytest = "^8.0.0"
httpx = "^0.28.0"

[tool.pytest.ini_options]
testpaths = ["test"]
pythonpath = ["."]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
