spring:
  application:
    name: yu-ai-agent
  profiles:
    active: local
# 临时注释掉，便于大家开发调试和部署（实际填写数据库信息）
#  datasource:
#    url: xxx
#    username: root
#    password: 123456
server:
  port: 8123
  servlet:
    context-path: /api
# springdoc-openapi config
springdoc:
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
  api-docs:
    path: /v3/api-docs
  group-configs:
    - group: 'default'
      paths-to-match: '/**'
      packages-to-scan: com.yupi.yuaiagent.controller
# knife4j config
knife4j:
  enable: true
  setting:
    language: zh_cn
# searchAPI
search-api:
  # 需要替换为你自己的 key
  api-key: 你的 API Key
redis:
  KEY_PREFIX: "message_store:"